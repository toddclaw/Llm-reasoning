name: deliberate-ci

on:
  push:
    paths:
      - "deliberate/**"
      - ".github/workflows/deliberate-ci.yml"
  pull_request:
    paths:
      - "deliberate/**"
      - ".github/workflows/deliberate-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliberate
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: pytest -q
