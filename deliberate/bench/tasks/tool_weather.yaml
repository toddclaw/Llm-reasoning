id: tool_weather
kind: tool
difficulty: 2
tags: [tool-calling]
request:
  messages:
    - role: user
      content: "What's the weather in Paris right now? Use the available tool."
  tools:
    - type: function
      function:
        name: get_weather
        description: Get the current weather for a city.
        parameters:
          type: object
          properties:
            city: { type: string }
          required: [city]
  tool_choice: auto
  temperature: 0
grade:
  type: tool_call
  expected_name: get_weather
  expected_args:
    city: Paris
