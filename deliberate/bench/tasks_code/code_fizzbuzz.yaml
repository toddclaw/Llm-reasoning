id: code_fizzbuzz
kind: code
difficulty: 1
tags: [coding, python]
request:
  messages:
    - role: user
      content: >
        Write a Python function `fizzbuzz(n)` that returns "Fizz" if n is divisible
        by 3, "Buzz" if divisible by 5, "FizzBuzz" if divisible by both, otherwise
        the number as a string. Reply with only the code.
  temperature: 0.2
grade:
  type: exec
  language: python
  tests: |
    assert fizzbuzz(3) == "Fizz"
    assert fizzbuzz(5) == "Buzz"
    assert fizzbuzz(15) == "FizzBuzz"
    assert fizzbuzz(7) == "7"
    assert fizzbuzz(30) == "FizzBuzz"
