id: code_anagram
kind: code
difficulty: 2
tags: [coding, python]
request:
  messages:
    - role: user
      content: >
        Write a Python function `is_anagram(a, b)` that returns True if and only if
        strings a and b are anagrams of each other, ignoring case and spaces.
        Reply with only the code.
  temperature: 0.2
grade:
  type: exec
  language: python
  tests: |
    assert is_anagram("listen", "silent") is True
    assert is_anagram("Dormitory", "Dirty Room") is True
    assert is_anagram("hello", "world") is False
    assert is_anagram("a", "ab") is False
